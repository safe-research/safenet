name: integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration:
    name: integration (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sentinel
            just-target: test-integration-sentinel
            just-args: ""
            log-artifact: sentinel-integration-logs

          - name: sentinel-engine
            just-target: test-integration-sentinel-engine
            just-args: sentinel-test-vectors
            log-artifact: sentinel-engine-integration-logs

          - name: validator
            just-target: test-integration-validator
            just-args: ""
            log-artifact: validator-integration-logs

          - name: validator-reorg-nonce
            just-target: test-integration-validator-reorg-nonce
            just-args: ""
            log-artifact: validator-integration-reorg-nonce-logs

          - name: validator-deep-reorg
            just-target: test-integration-validator-deep-reorg
            log-artifact: validator-integration-deep-reorg-logs

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Check out sentinel test vectors
        if: matrix.name == 'sentinel-engine'
        uses: actions/checkout@v5
        with:
          repository: safe-research/sentinel-test-vectors
          path: sentinel-test-vectors

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # We fix the foundry version because of a formatting bug introduced
          # in version 1.7.0.
          # See <https://github.com/foundry-rs/foundry/issues/13362>
          version: v1.5.1

      - uses: ./.github/actions/install-just

      - run: just ${{ matrix.just-target }} ${{ matrix.just-args }}

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.log-artifact }}
          path: "*_logs.txt"
          if-no-files-found: ignore
