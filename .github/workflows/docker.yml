name: docker

on:
  pull_request:
  push:
    tags:
      - v*
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        platform: [amd64, arm64]
        image: [validator, sentinel, sentinel-engine, contracts]
        include:
          - platform: amd64
            runner: ubuntu-latest
            suffix: ""
          - platform: arm64
            runner: ubuntu-24.04-arm
            suffix: "-arm64"
          - image: validator
            dockerfile: crates/validator/Dockerfile
          - image: sentinel
            dockerfile: crates/sentinel/Dockerfile
          - image: sentinel-engine
            dockerfile: crates/sentinel-engine/Dockerfile
          - image: contracts
            dockerfile: contracts/Dockerfile

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/safe-research/safenet-${{ matrix.image }}${{ matrix.suffix }}
          flavor: |
            latest=false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT_SHA=${{ github.sha }}
